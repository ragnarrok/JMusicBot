name: Auto Release

# Continuous releases from trunk. This is the only workflow that runs on master pushes:
# build-and-test.yml gates pull requests, and docker-publish.yml builds from the tag
# created here.
#
# Every push to master: run the full test suite (with coverage), work out the next
# version, build the JAR with that version, tag the merged commit and publish a GitHub
# release with the JAR attached. The Docker image for the new tag is then built by
# docker-publish.yml.
#
# This workflow never commits to master, so it works with a branch ruleset that
# requires pull requests. pom.xml keeps a base version; the real version lives in the
# tags and is injected at build time (here and in the Docker build).
#
# Version rule: the pom.xml version (minus any -SNAPSHOT suffix) is used as-is when
# no tag exists for it yet, so a manual minor/major bump in pom.xml is honoured.
# Otherwise the patch number is incremented until an unused tag is found.
on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'LICENSE'
      - 'CNAME'
      - 'docs/**'
      - '*.example.yml'
      - '*.example.yaml'
      - '.circleci/**'

# Releases must never run concurrently: two runs would race for the same version.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # push the tag, create the release
      actions: write    # dispatch docker-publish for the new tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history: needed to inspect existing tags

      - name: Set up Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          POM_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          BASE="${POM_VERSION%-SNAPSHOT}"
          if ! [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pom.xml version '$POM_VERSION' is not MAJOR.MINOR.PATCH"
            exit 1
          fi

          git fetch --tags --quiet
          NEXT="$BASE"
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            while git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; do
              PATCH=$((PATCH + 1))
              NEXT="$MAJOR.$MINOR.$PATCH"
            done
          fi

          # Newest tag reachable from this commit, for the changelog compare link
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${{ github.sha }}" 2>/dev/null || true)

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Releasing $NEXT (pom.xml base version is $POM_VERSION, previous tag: ${PREV:-none})"

      - name: Set version for this build (not committed)
        run: |
          mvn -B -q versions:set -DnewVersion=${{ steps.version.outputs.next }}
          mvn -B -q versions:commit

      - name: Test and build with coverage
        run: |
          COMMIT_TIME=$(git log -1 --format=%cI)
          mvn --batch-mode verify -Pcoverage -Dproject.build.outputTimestamp=$COMMIT_TIME

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          report_type: coverage
          files: target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Rename JAR
        run: mv target/*-All.jar JMusicBot-${{ steps.version.outputs.next }}.jar

      - name: Tag the merged commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.next }}" -m "Release v${{ steps.version.outputs.next }}" "${{ github.sha }}"
          git push origin "v${{ steps.version.outputs.next }}"

      - name: Write release notes
        # The notes are the description of the pull request that was merged, falling
        # back to the commit message for a direct push. jq writes the body verbatim so
        # markdown, quotes and backticks in the PR survive untouched.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          NEXT: ${{ steps.version.outputs.next }}
          PREV: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          NOTES=release-notes.md
          PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)] | .[0] // empty' 2>/dev/null || true)

          if [ -n "$PR" ]; then
            NUMBER=$(jq -r '.number' <<< "$PR")
            TITLE=$(jq -r '.title' <<< "$PR")
            BODY=$(jq -r '.body // ""' <<< "$PR")
            echo "Using the description of PR #$NUMBER: $TITLE"
            {
              echo "## $TITLE ([#$NUMBER](https://github.com/$REPO/pull/$NUMBER))"
              echo
              if [ -n "$BODY" ]; then
                printf '%s\n' "$BODY"
              else
                echo "_The pull request had no description._"
              fi
            } > "$NOTES"
          else
            echo "No merged pull request found for $SHA; using the commit message"
            {
              echo "## $(git log -1 --format=%s "$SHA")"
              echo
              git log -1 --format=%b "$SHA"
            } > "$NOTES"
          fi

          {
            echo
            echo "---"
            echo "**Setup:** see the [README](https://github.com/$REPO#setup) for setup, [running the jar](https://github.com/$REPO#running-directly-without-docker) and [Docker](https://github.com/$REPO#docker)."
            echo "**Docker image:** \`ghcr.io/ragnarrok/jmusicbot:$NEXT\`"
            if [ -n "$PREV" ]; then
              echo "**Full changelog:** https://github.com/$REPO/compare/$PREV...v$NEXT"
            fi
            echo
            echo "<sub>Released automatically from master commit $SHA.</sub>"
          } >> "$NOTES"

          echo "::group::release-notes.md"
          cat "$NOTES"
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.version.outputs.next }}
          commit: ${{ github.sha }}
          name: v${{ steps.version.outputs.next }}
          draft: false
          prerelease: false
          generateReleaseNotes: false
          artifacts: "JMusicBot-${{ steps.version.outputs.next }}.jar"
          bodyFile: release-notes.md

      - name: Publish Docker image for the new tag
        # Tags pushed with GITHUB_TOKEN do not fire other workflows' push triggers,
        # so docker-publish.yml is dispatched explicitly on the new tag.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-publish.yml --ref "v${{ steps.version.outputs.next }}"
