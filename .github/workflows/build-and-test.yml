name: Build and Test

# Pre-merge gate: build and test every pull request targeting master.
# Pushes to master are covered by auto-release.yml, which runs the same
# build before it tags and publishes a release. Running this
# workflow on master too would only duplicate that work.
on:
  pull_request:
    branches:
      - master  # PRs targeting trunk

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read  # Only need to checkout repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: |
          COMMIT_TIME=$(git log -1 --format=%cI)
          mvn --batch-mode verify -Dproject.build.outputTimestamp=$COMMIT_TIME

