name: Publish Docker Image

# Builds and publishes the Docker image for a release tag.
# Every release tag is the newest commit on master (auto-release.yml creates one
# per code push), so the tag build is also what "latest" points at. There is no
# separate master build: that would build the same code twice per merge.
on:
  # Version tags pushed by hand (e.g. from the manual Make Release workflow once
  # its draft is published)
  push:
    tags:
      - 'v*'
  # auto-release.yml dispatches this workflow on the tag it just created, because
  # tags pushed with GITHUB_TOKEN do not fire the push trigger above.
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ragnarrok/jmusicbot

jobs:
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only ever build from a version tag, however the workflow was started
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write  # Required for pushing to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0  # Full history needed for git commands

      - name: Extract metadata
        id: metadata
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          POM_VERSION=$(grep -m 1 '<version>' pom.xml | sed 's/.*<version>\([^<]*\)<\/version>.*/\1/' | tr -d ' ')
          SHA_SHORT=$(git rev-parse --short HEAD)
          TIMESTAMP=$(git log -1 --format=%cI)
          if [[ "$VERSION" != "$POM_VERSION" ]]; then
            echo "::warning::Tag version $VERSION differs from pom.xml version $POM_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (pom: $POM_VERSION) at $SHA_SHORT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          # For multi-arch images, annotations must be attached to the image index
          # GitHub Packages reads annotations from the index level for multi-arch images
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags: the release version, "latest", and the commit sha
          tags: |
            type=raw,value=${{ steps.metadata.outputs.version }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.metadata.outputs.sha }}
          # Labels are automatically generated from git context by metadata-action
          # No need to specify them - metadata-action will create standard OCI labels

      - name: Build and push Docker image
        id: build
        uses: ./.github/actions/docker-build
        with:
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          timestamp: ${{ steps.metadata.outputs.timestamp }}
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
